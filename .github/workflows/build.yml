name: Build and run the 財政検証 pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show compiler versions
        run: |
          gcc --version
          g++ --version

      - name: Build wakuc
        working-directory: source/wakuc
        run: |
          mkdir -p ../../bin
          gcc -g -o ../../bin/wakuc \
            main.c cntl.c cutout.c fout.c readdata.c roudfout.c \
            setjinko.c simlichisan.c simlkou.c simlkyos.c simlpart.c \
            simlroud.c stdfm.c zero.c -lm

      - name: Build bas
        # Despite the .c extension, this source uses C++ headers (<cstdio> etc.).
        # main.c double-closes fp_in[0]: read_file.c already does
        # fclose(fp_in[DOKUZI]) (DOKUZI == 0, mfile_open.h), then main.c
        # calls fclose(fp_in[0]) again a few lines later. This is a genuine
        # bug in the original source -- glibc's malloc detects the double
        # free ("double free or corruption (!prev)") where the program's
        # original Unix host apparently did not. Same build-only-copy+sed
        # approach as nat/emp_kyufu: drop the redundant second close: the
        # committed source under source/bas is untouched.
        working-directory: source/bas
        run: |
          rm -rf /tmp/build_bas && cp -r . /tmp/build_bas
          sed -i '/fclose( fp_in\[0\] );/d' /tmp/build_bas/main.c
          # Same class of bug: main.c calls printout(0) then printout(1);
          # printout.c unconditionally closes fp_out[OUTPUT] (opened once,
          # append mode) every call, so the 2nd call double-closes it. Only
          # close on the final call.
          sed -i 's/fclose( fp_out\[OUTPUT\] );/if (cut_ba == 1) fclose( fp_out[OUTPUT] );/' /tmp/build_bas/printout.c
          cd /tmp/build_bas
          g++ -g -o "$GITHUB_WORKSPACE/bin/bas" \
            Atamawari.c Atamawari_cut.c cntl.c econ.c file_open.c \
            file_write_cut.c file_write_kakyu.c main.c printout.c \
            read_cut.c read_file.c ReadHiyousha.c ReadKokunen_jisseki.c \
            stdfm.c tumatumi_cal_jisseki.c tyousei.c waku.c dtst.c \
            dokuzi_cal.c -lm

      - name: Build nat
        # Despite the .c extension, this source uses C++ headers (<cstdio> etc.).
        # The source defines its own fdiv(double,double), which collides with
        # glibc's C23 narrowing fdiv() declared unconditionally for C++ in
        # <bits/mathcalls-narrow.h>. A -D rename doesn't work here (it would
        # rename glibc's declaration too, since preprocessing is textual and
        # blind to origin). Instead rename only within a build-only copy of
        # this module's source; the committed source under source/nat is
        # untouched.
        working-directory: source/nat
        run: |
          rm -rf /tmp/build_nat && cp -r . /tmp/build_nat
          sed -i 's/\bfdiv\b/fdiv_nat_impl/g' /tmp/build_nat/*.c /tmp/build_nat/*.h
          cd /tmp/build_nat
          g++ -g -o "$GITHUB_WORKSPACE/bin/nat" \
            main.c stdfm.c cntl.c file_open.c seid.c econ.c waku.c \
            kaizen.c dtst.c kiso.c noufuritu.c siml.c str_op.c shke.c \
            stat.c printout.c -lm

      - name: Build emp_shushi (asys20)
        # fcls.c unconditionally closes ifp_Touitu, but fopn.c only opens it
        # when Touitu>=1. With the standard scenario (Touitu=0) this closes
        # a never-opened global FILE* -- segfault. Guard to match the open
        # condition, same as the nat/emp_kyufu/bas fixes: build-only copy,
        # committed source untouched.
        working-directory: source/emp_shushi
        run: |
          rm -rf /tmp/build_empshushi && cp -r . /tmp/build_empshushi
          sed -i 's/fclose(ifp_Touitu);/if (Touitu >= 1) fclose(ifp_Touitu);/' /tmp/build_empshushi/fcls.c
          cd /tmp/build_empshushi
          gcc -g -o "$GITHUB_WORKSPACE/bin/emp_shushi" \
            main.c cntl.c stdfun.c fopn.c fcls.c flck.c econ.c rdfl.c \
            shus.c shus_calc.c shus_out.c shus_fullout.c -lm

      - name: Build emp_kyufu (usys20)
        # fp_map[key] is used as a *read* in many files (e.g. dtst.cpp,
        # econ.cpp, seid.cpp). std::map::operator[] silently inserts a
        # NULL-valued entry for any key that was never opened by fopn(), and
        # fcls() then calls fclose() on every entry unconditionally --
        # fclose(NULL) is undefined behaviour; glibc segfaults on it. On the
        # program's original Unix host this most likely was a silent no-op
        # (consistent with the source never guarding it). We only guard the
        # fclose() call itself in a build-only copy; committed source under
        # source/emp_kyufu is untouched.
        working-directory: source/emp_kyufu
        run: |
          rm -rf /tmp/build_empkyufu && cp -r . /tmp/build_empkyufu
          sed -i 's/fclose(itr->second);/if (itr->second) fclose(itr->second);/' /tmp/build_empkyufu/fileio.cpp
          cd /tmp/build_empkyufu
          g++ -g -I ext -I common -I lib -o "$GITHUB_WORKSPACE/bin/emp_kyufu" \
            sepslib.cpp main.cpp zero.cpp cntl.cpp sepsd.cpp fileio.cpp \
            flck.cpp waku.cpp econ.cpp seid.cpp krgn.cpp kiso.cpp sknr.cpp \
            subrh.cpp subrj.cpp dtst.cpp shke.cpp shkehiho.cpp shkejken.cpp \
            shkejsha.cpp siku.cpp shkejuk.cpp shkekiso.cpp dsitk.cpp \
            siml.cpp simlg.cpp simlbzw.cpp simlsaite1.cpp simlsaite2.cpp \
            simlrhnf.cpp outkn.cpp rousaki.cpp pstat.cpp stat.cpp \
            outhou.cpp crshfl.cpp -lm

      - name: List built binaries
        run: ls -la bin/

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  # Each of the report's four economic cases runs the whole five-module chain
  # in its own job. They are independent runs, so they go in parallel and --
  # more importantly -- each gets a private /suuri tree, which means every
  # scenario can keep the same 試算番号/外枠番号 (1000) with no chance of one
  # scenario's intermediate files being read by another.
  scenario:
    name: run econ-${{ matrix.econ }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false     # a diverging scenario must not cancel the others
      matrix:
        include:
          # ROUDR is the labour-force-participation scenario, which the report
          # pairs with the economic case (第3-4-28表): the two growth cases use
          # 労働参加進展, 過去30年投影 uses 漸進, ゼロ成長 uses 現状.
          # wakuc/cntl.c: 1=進展, 2=漸進, 3=現状 (all at 入国超過16万人).
          - econ: "3001"
            roudr: "1"
            label: 高成長実現ケース
          - econ: "3002"
            roudr: "1"
            label: 成長型経済移行・継続ケース
          - econ: "3003"
            roudr: "2"
            label: 過去30年投影ケース
          - econ: "3004"
            roudr: "3"
            label: 1人当たりゼロ成長ケース
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin

      - name: Restore the executable bit
        # upload-artifact does not preserve file modes
        run: chmod +x bin/*

      - name: Install gdb (for backtraces if a module crashes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
          echo "core.%p" | sudo tee /proc/sys/kernel/core_pattern >/dev/null

      - name: Set up the /suuri/rev2024 tree
        # The original programs hardcode absolute paths under
        # /suuri/rev2024/<module>/..., a convention from the original Unix
        # host. We recreate that tree rather than patch the source, to keep
        # the reference implementation byte-for-byte faithful.
        #
        # Every output directory has to exist before the run: the programs
        # call mkdir() non-recursively and never check its return value, so a
        # missing parent silently yields a failed fopen() later.
        run: |
          sudo mkdir -p \
            /suuri/rev2024/wakuc/rslt \
            /suuri/rev2024/nat/{rslt,data,base_data,io_file} \
            /suuri/rev2024/bas/{settei,data,rslt,base_data,io_file} \
            /suuri/rev2024/emp/data \
            /suuri/rev2024/emp/rslt/u-rev/{shus,kiso,bunpu,kaite,hikaku,ashimoto,hou,kisor} \
            /suuri/rev2024/emp/rslt/ez_arev/{cutr,shushi}
          sudo chown -R "$(id -u):$(id -g)" /suuri
          cp -r data/wakuc/data      /suuri/rev2024/wakuc/data
          cp -r data/nat/base_data/* /suuri/rev2024/nat/base_data/
          cp -r data/nat/io_file/*   /suuri/rev2024/nat/io_file/
          cp -r data/bas/base_data/* /suuri/rev2024/bas/base_data/
          cp -r data/bas/io_file/*   /suuri/rev2024/bas/io_file/
          cp -r data/emp/data/*      /suuri/rev2024/emp/data/

      - name: Run wakuc (外枠)
        # CP sequence (source/wakuc/cntl.c), one value per line:
        #   BANGO=1000  (試算番号)
        #   MODE=0      (適用拡大なし・現行制度)
        #   MODE45=0    (基礎40年・現行制度)
        #   JIN=1       (出生中位) -- cntl.c: 1=中位, 2=高位, 3=低位. An earlier
        #                revision passed JIN=2 while commenting it as 中位; the
        #                crosscheck against the official report caught it (our
        #                所得代替率 matched the 出生高位 column, not 中位).
        #   QX=1        (死亡中位)
        #   NC=0        (入国超過16万人・令和5年推計ベース)
        #   ROUDR       (労働力率シナリオ -- varies by economic case, see matrix)
        run: |
          printf '1000\n0\n0\n1\n1\n0\n${{ matrix.roudr }}\n' | ./bin/wakuc
          echo "--- exit code: $? ---"
          ls /suuri/rev2024/wakuc/rslt/ver_4_1/rslt1000 | wc -l

      - name: Run nat (国民年金)
        # CLI args (source/nat/cntl.c), after infile/outfile:
        #   KOKUNEN=1000, ECON=<matrix>, SOTOWAKU=1000 (wakuc's BANGO above),
        #   BIRTH=0, DEATH=M (中位), KAKO=0, TINSURA=1, KAKUDAI=0,
        #   KAKUDAI_YEAR=2027, OPTION=0, OP_START=2031,
        #   OP_HIKIAGE_KANKAKU=3, SOTOWAKU_JURAI=1000
        #   -- jikko_nat.sh の標準デフォルト値
        run: |
          ./bin/nat \
            /suuri/rev2024/nat/io_file/infile.csv \
            /suuri/rev2024/nat/io_file/outfile.csv \
            1000 ${{ matrix.econ }} 1000 0 M 0 1 0 2027 0 2031 3 1000
          echo "--- exit code: $? ---"

      - name: Run emp_kyufu (usys20, 給付費推計)
        # Stdin (source/emp_kyufu/main.cpp then cntl.cpp), one value per line:
        #   key=11 (通常実行), iname=1000, iecon=<matrix>, iwname=1000,
        #   seimei=4 (死亡中位), flg_part=0, flg_sigo=0, flg_kozax=0,
        #   houjou=0, flg_inout=0
        # main.cpp loops over pseid in {0,1,4,5} (kou/kok/ren/sig) internally
        # when key==11, so this one invocation covers all four institutions.
        run: |
          ulimit -c unlimited
          ulimit -s unlimited || true
          set +e
          printf '11\n1000\n${{ matrix.econ }}\n1000\n4\n0\n0\n0\n0\n0\n' | ./bin/emp_kyufu
          status=$?
          set -e
          echo "--- exit code: $status ---"
          if [ "$status" -ne 0 ]; then
            core=$(find "$GITHUB_WORKSPACE" /tmp -maxdepth 3 -iname 'core*' 2>/dev/null | head -1)
            if [ -n "$core" ]; then gdb -q -batch -ex "bt full" ./bin/emp_kyufu "$core"; fi
            exit "$status"
          fi

      - name: Run bas (基礎年金)
        # CLI args (source/bas/cntl.c), after infile/outfile:
        #   KOUNEN=1000, KOKUNEN=1000, ECON=<matrix>, SOTOWAKU=1000,
        #   SOTOWAKU_CUT=1000 (unused at Option=0), YOBI=000, kako=0,
        #   CARRY=1, D_MACRO=0, Option=0, OP_START=2031,
        #   OP_HIKIAGE_KANKAKU=3, TOUGOU=0, CUT_KOTEI=0, CUT_ONE_SHUTU=0
        run: |
          ulimit -c unlimited
          set +e
          ./bin/bas \
            /suuri/rev2024/bas/io_file/infile.csv \
            /suuri/rev2024/bas/io_file/outfile.csv \
            1000 1000 ${{ matrix.econ }} 1000 1000 000 0 1 0 0 2031 3 0 0 0
          status=$?
          set -e
          echo "--- exit code: $status ---"
          if [ "$status" -ne 0 ]; then
            core=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -iname 'core*' 2>/dev/null | head -1)
            if [ -n "$core" ]; then gdb -q -batch -ex "bt full" ./bin/bas "$core"; fi
            exit "$status"
          fi

      - name: Run emp_shushi (asys20, 収支計算)
        # Stdin (source/emp_shushi/cntl.c then main.c's set_filenum):
        #   Saimu=0, Fpset=8, Flg_Part=0, Flg_Sigo=0, Flg_Houjou=0, Touitu=0,
        #   Flg_Kmakuro=0, Flg_Dmakuro=0, Nfile=1000, Ecfile=<matrix>,
        #   Wcfile=1000, Cutrfile4=000
        # Fpset=8 reads bas's cuta output directly (the first-run path);
        # Fpset=9 presumes existing files under emp/rslt/ez_arev/cutr/ and is
        # for iterated runs, so it cannot be used here.
        # Cutrfile4 must match bas's YOBI (matched via the KYOSHUTUKIN filename).
        run: |
          ulimit -c unlimited
          set +e
          printf '0\n8\n0\n0\n0\n0\n0\n0\n1000\n${{ matrix.econ }}\n1000\n000\n' | ./bin/emp_shushi
          status=$?
          set -e
          echo "--- exit code: $status ---"
          find /suuri/rev2024/emp/rslt/ez_arev -type f | sort
          if [ "$status" -ne 0 ]; then
            core=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -iname 'core*' 2>/dev/null | head -1)
            if [ -n "$core" ]; then gdb -q -batch -ex "bt full" ./bin/emp_shushi "$core"; fi
            exit "$status"
          fi

      - name: Collect this scenario's result CSVs
        # 01shushi/03summary (emp_shushi) carry the headline figures
        # (所得代替率, 積立金) the dashboard and the official-report crosscheck
        # read; the upstream modules' output is kept so a later session can
        # inspect them without re-running the ~12min chain.
        run: |
          mkdir -p /tmp/results
          cp -r /suuri/rev2024/emp/rslt/ez_arev /tmp/results/emp_ez_arev
          cp -r /suuri/rev2024/wakuc/rslt       /tmp/results/wakuc_rslt
          cp -r /suuri/rev2024/nat/rslt         /tmp/results/nat_rslt
          cp -r /suuri/rev2024/bas/rslt         /tmp/results/bas_rslt

      - uses: actions/upload-artifact@v4
        with:
          name: scenario-results-${{ matrix.econ }}
          path: /tmp/results
